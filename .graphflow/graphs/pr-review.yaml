version: 1
name: pr-review
budget: 400k
defaults:
  tier: standard

# Review-only. Nothing here builds: the built-in templates all implement, and
# this runs against code that already exists. Ported from the backend's
# pr-guard-audit, plus a uiux lens because this repo has UI.
inputs: [target]

nodes:
  suites:
    kind: script
    run: "flutter analyze && flutter test"

  code-review:
    kind: check
    role: code-reviewer
    prompt: |
      {{ inputs.target }}

      一般正確性 review。不要提風格。

  uiux-review:
    kind: check
    role: uiux-reviewer
    prompt: |
      {{ inputs.target }}

      使用者第一次真的用到這個功能。看:不會用的時候知道下一步嗎、錯誤訊息說得出
      「這是我的帳戶問題」還是只說「壞了」、要按下去的東西資訊夠不夠判斷、
      長內容/鍵盤彈出/窄螢幕還讀得下去嗎。

  guard-audit:
    kind: check
    role: code-reviewer
    tier: heavy
    prompt: |
      {{ inputs.target }}

      只找**不會失敗的守門**:斷言存在、但無論程式對錯都是綠的。逐條說明**要怎麼
      突變才會紅**;想不出能讓它紅的突變,那條就是壞守門。

      這個 repo 已經死過的形態,逐一對照:
      - **斷言的東西不在危險側**(死過兩次:分類器拿不到金鑰、`toString` 根本沒有
        override —— 兩條的 `not.toContain` 都恆綠)
      - fixture 是 null / 空陣列 / 跟同物件的鄰居撞號
      - 回應與期望同時缺同一個 key,整份 `toEqual` 跟自己達成一致
      - in-memory fake 有自己的實作,真正那條路徑零覆蓋
      - 同一個 tester pump 兩次,Flutter 重用 State
      - `pump(duration)` 讓計時器先發,守的那條路沒被走到
      - 「不包含 X」型的斷言,對之後新增的東西永遠是綠的
      - 一顆按鈕存在但接到空函式

  fix:
    kind: task
    role: fixer
    tier: light
    after: [suites, code-review, uiux-review, guard-audit]
    when: any-fail
    goto: [suites, code-review, uiux-review, guard-audit]
    max_iterations: 2
    prompt: |
      依下面三份 review 的發現修正。每補一條守門就說明能讓它紅的突變。

      code review:
      {{ nodes.code-review.output }}

      UI/UX:
      {{ nodes.uiux-review.output }}

      守門稽核:
      {{ nodes.guard-audit.output }}

  ship:
    kind: gate
    after: [suites, code-review, uiux-review, guard-audit]
    when: all-pass
    show: |
      code review:
      {{ nodes.code-review.output }}

      UI/UX:
      {{ nodes.uiux-review.output }}

      守門稽核:
      {{ nodes.guard-audit.output }}
