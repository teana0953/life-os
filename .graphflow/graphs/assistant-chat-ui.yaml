version: 1
name: assistant-chat-ui
budget: 700k
defaults:
  tier: standard

inputs: [goal]

nodes:
  plan:
    kind: task
    role: planner
    tier: heavy
    prompt: |
      {{ inputs.goal }}

      **這一輪只規劃,不寫程式。** 產出:檔案清單、每個檔案做什麼、每條守門要怎麼寫才會紅。

      **先判斷這一刀是不是太大。** 如果是,說出該切成幾刀、每刀的邊界在哪、以及
      為什麼那條線是對的。不要為了一次做完而把範圍硬塞進一刀。

      必須回答的:

      - 對話狀態放哪(controller 的形狀)、**歷史留在記憶體還是要持久化**
        (後端刻意不存,理由在 proposal;前端存不存是這一刀的決定)
      - **確認卡按下去之後走哪條路** —— 是呼叫既有的建立交易 use case,還是新的?
        建立成功/失敗分別怎麼回饋?**同一張卡能不能被按兩次?**
      - 後端五種錯誤(400 缺金鑰 / 400 gemini_key_rejected / 429 quota /
        403 model_unavailable / 502)各自在畫面上長什麼樣。**金鑰被拒要指回設定頁。**
      - 入口:**HomeScreen 空間卡 + 記帳與健康兩個殼的 AppBar 圖示**(這是已拍板的),
        AppBar 那個要帶當下上下文(記帳:分頁 + 月份)。**上下文要畫在畫面上**,
        否則就是「畫面顯示 A、資料是 B」的新形態。
      - **沒有金鑰時**:入口照樣在、點得下去,進去是設定狀態 + 到設定頁的出口。
        不隱藏、不只是灰掉。
      - 金鑰怎麼從 `GeminiKeyController` 走到 HTTP header —— controller 的 `key`
        getter doc 寫明「僅供 adapter,禁止 render」,這條要守得住。

      既有形狀:`lib/shared/assistant/gemini_key_controller.dart`(上一刀)、
      go_router 的路由在 `lib/app.dart`、HTTP repository 的樣板看
      `lib/contexts/vitals/infrastructure/http_vitals_repository.dart`。

  approve-plan:
    kind: gate
    after: [plan]
    show: "{{ nodes.plan.output }}"

  implement:
    kind: task
    role: implementer
    tier: heavy
    after: [approve-plan]
    prompt: |
      照核可的計畫實作。鐵則:
      - 完整金鑰**只在送出 header 的那一刻**離開 controller,不進畫面、log、序列化狀態
      - 每寫一條守門就想「什麼突變會讓它紅」;想不出來就是壞守門
      - fixture 的值要落在**危險側**,而且跟同物件的鄰居不撞號
      - 窄螢幕 320dp / textScale 2.0 要驗,**鍵盤彈出時**的對話輸入列也要

  test:
    kind: script
    after: [implement]
    run: "flutter analyze && flutter test"

  code-review:
    kind: check
    role: code-reviewer
    after: [implement]
    prompt: |
      只看這一刀的 diff。重點:
      - 完整金鑰有沒有任何路徑會回顯到畫面、log、或序列化狀態
      - 確認卡的重複送出、送出失敗、送出後畫面狀態
      - 五種後端錯誤是不是真的分得開,還是最後都塌成一句「失敗」

  uiux-review:
    kind: check
    role: uiux-reviewer
    after: [implement]
    prompt: |
      這一刀是使用者第一次真的用到助手。看:
      - 沒有金鑰時,使用者知道下一步是什麼嗎
      - **確認卡上的資訊夠不夠讓人判斷該不該按**(金額、分類、日期都在嗎)
      - 上下文(以哪個月為準)有沒有畫在畫面上
      - 錯誤訊息有沒有告訴使用者「這是我的帳戶問題」還是只說「壞了」
      - 對話很長、鍵盤彈出、窄螢幕時還讀得下去嗎

  guard-audit:
    kind: check
    role: code-reviewer
    tier: heavy
    after: [implement]
    prompt: |
      只找**不會失敗的守門**。逐條說明要怎麼突變才會紅;想不出來的那條就是壞守門。

      這個 repo 反覆出現的形態,逐一對照:
      - **斷言的東西不在危險側**(前兩刀各死一條:分類器拿不到金鑰、
        `toString` 根本沒有 override —— 兩條的 `not.toContain` 都恆綠)
      - fixture 是 null / 空 / 跟鄰居撞號
      - 回應與期望同時缺同一個 key,整份 `toEqual` 跟自己達成一致
      - 同一個 tester pump 兩次,Flutter 重用 State
      - `pump(duration)` 讓計時器先發,守的那條路沒被走到
      - 「不包含 X」型的斷言,對之後新增的東西永遠是綠的
      - 一顆按鈕**存在但接到空函式**

  fix:
    kind: task
    role: fixer
    after: [test, code-review, uiux-review, guard-audit]
    when: any-fail
    goto: [test, code-review, uiux-review, guard-audit]
    max_iterations: 2
    prompt: "依三份 review 的發現修正。每補一條守門就說明能讓它紅的突變。"

  ship:
    kind: gate
    after: [test, code-review, uiux-review, guard-audit]
    when: all-pass
    show: |
      code review:
      {{ nodes.code-review.output }}

      UI/UX:
      {{ nodes.uiux-review.output }}

      守門稽核:
      {{ nodes.guard-audit.output }}
