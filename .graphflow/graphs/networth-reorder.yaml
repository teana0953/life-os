version: 1
name: networth-reorder
budget: 300k
defaults:
  tier: standard

inputs: [issue]

nodes:
  reproduce:
    kind: task
    role: implementer
    tier: heavy
    prompt: |
      {{ inputs.issue }}

      根因已經查過,不要重查,直接照這個寫測試:
      `createAccount` 不送 sortOrder,後端 `input.sortOrder ?? 0`
      (drizzle-networth-repository.ts:69),所以每個使用者自建的科目都是 0,
      跟該 kind 第一個預設科目撞在一起。`_moveUp`
      (account_manage_sheet.dart:142) 是對調兩筆的 sortOrder,兩筆都是 0
      時對調等於沒動;而 `_group` 只按 sortOrder 排,並列時 Dart 的
      `List.sort` 不保證穩定。

      寫**先紅**的 widget 測試,每個症狀一條,fixture 必須真的踩到失效區:
      (a) 兩筆 sortOrder 都是 0 時按向上,順序真的改變
      (b) 同一組多筆並列時,連按向上能一路移到最上面
      (c) 同樣的資料重新載入兩次,顯示順序一致

      跑 `flutter test` 確認每條都是紅的、而且紅在斷言不是編譯錯,把每條
      「紅在哪一行、訊息是什麼」寫進輸出。

  fix:
    kind: task
    role: implementer
    after: [reproduce]
    prompt: |
      讓 {{ nodes.reproduce.output }} 的測試轉綠。已核可的做法:

      1. 顯示排序用 **(sortOrder, id)** 當穩定比較鍵 —— 前端模型與後端回應
         都沒有 createdAt,不要假設它存在,也不要為了它去改後端。
      2. 移動時**把整組重新編號成 0..n**,不要只對調兩筆 —— 對調在有並列值
         時是 no-op,那正是這個 bug。
      3. **新增科目要拿到該組 max+1**,否則問題會一直長回來。
      4. 加**向下**按鈕:第一列停用向上、最後一列停用向下。

      重編號會對同一組每筆送一次更新;要處理其中一次失敗(不能留下一半重編
      的狀態就當成功),並且在寫入期間停用按鈕。

  gate:
    kind: script
    after: [fix]
    run: "flutter analyze && flutter test"

  code-review:
    kind: check
    role: code-reviewer
    after: [fix]

  uiux-review:
    kind: check
    role: uiux-reviewer
    after: [fix]

  refix:
    kind: task
    role: implementer
    tier: light
    after: [gate, code-review, uiux-review]
    when: any-fail
    goto: [gate, code-review, uiux-review]
    max_iterations: 3

  ship:
    kind: gate
    after: [gate, code-review, uiux-review]
    when: all-pass
    show: |
      code review: {{ nodes.code-review.output }}
      uiux review: {{ nodes.uiux-review.output }}
