version: 1
name: assistant-sheet-home
budget: 550k
defaults:
  tier: standard

# 兩刀一起走:助手改成疊在原畫面上的面板(不是整頁換掉)、首頁把「AI 助手」
# 格子換成動作列並標示未完成的格子。設計方向已在對話裡定案(見 goal),
# plan 節點的工作是把它打回原形、補漏、列出檔案清單,不是從零重想。
inputs: [goal]

nodes:
  plan:
    kind: task
    role: planner
    prompt: |
      {{ inputs.goal }}

      你的工作不是重新發想方向,是把上面已定的方向做成可執行計畫,並**主動找出
      它會壞在哪裡**。至少要回答:

      - 非不透明 route + modal barrier 在 go_router 下的實際行為:barrier 的
        點擊會不會真的 pop、`opaque:false` 下方 route 會不會被 `IndexedStack`
        之類的東西停掉、轉場期間下方畫面是否還在。
      - 深連結/重整直接落在 `/assistant`(下方沒有任何 route)時的樣子。
      - 鍵盤升起時 composer 會不會被蓋住 —— 面板貼齊螢幕底部這個前提若不成立
        會怎樣。
      - 首頁格子從 index 判斷改成資料驅動之後,既有測試會不會失去它們原本
        在守的東西。

      產出:步驟清單 + 要改的檔案清單 + 每一步的驗證方式(要能紅的守門)。

  approve-plan:
    kind: gate
    after: [plan]
    show: "{{ nodes.plan.output }}"

  implement:
    kind: task
    role: implementer
    after: [approve-plan]
    prompt: |
      已核可的計畫如下,照它實作:

      {{ nodes.plan.output }}

      鐵則:

      - **不要退化既有能力**:`/assistant` 現在是真路由,URL、瀏覽器上一頁、
        web 重整、深連結都能用。改成面板呈現之後這四樣必須全部還在 ——
        任何一樣掉了就是這一刀失敗。
      - 每寫一條守門就想「什麼突變會讓它紅」;想不出來就是壞守門。
      - `tap` 打不到只會警告、`enterText` 不做 hit-test:可及性要用**效果**
        斷言(有沒有真的 pop、文字有沒有真的進到欄位)。
      - 窄螢幕 320dp / textScale 2.0 要驗,高度與溢位都要。
      - 首頁移除助手格子後,`spaceAssistant` 這類因此變成沒人用的字串要一起
        清掉;**不要**順手刪別的既有死碼。

  test:
    kind: script
    after: [implement]
    run: "flutter analyze && flutter test"

  code-review:
    kind: check
    role: code-reviewer
    after: [implement]
    prompt: |
      只看這一刀的 diff。重點:
      - 路由語義:pop 的來源(barrier、AppBar 返回鍵、系統返回鍵)各自會發生
        什麼;從助手回到記帳的 reload 有沒有因為呈現方式改變而漏掉或重複。
      - 下方 route 在助手開著時仍然活著:它的 controller 會不會在這段期間
        被通知、重載、或搶焦點。
      - 深連結沒有下層時的分支:判斷時機對不對(route 掛進 navigator 之前
        問 `canPop` 會得到錯的答案)。
      - 首頁改資料驅動後,可點與不可點的分界是不是真的由資料決定。

  uiux-review:
    kind: check
    role: uiux-reviewer
    after: [implement]
    prompt: |
      兩個情境:(a) 從記帳頁叫出助手,(b) 從首頁動作列進助手。看:
      - 「這是疊在原本畫面上」有沒有讀得出來;要怎麼關掉,看得懂嗎。
      - 首頁動作列長得像可輸入的欄位嗎?若像但其實不能打字,是不是騙人。
      - 標了「即將推出」的格子,跟可用的格子在視覺上分得開嗎。
      - 面板高度在小螢幕 + 鍵盤升起時還剩多少可讀區域。

  guard-audit:
    kind: check
    role: code-reviewer
    after: [implement]
    prompt: |
      只找**不會失敗的守門**。逐條說明要怎麼突變才會紅;想不出來的就是壞守門。

      這個 repo 已經死過的形態,逐條對照:
      - 斷言的東西不在危險側(fixture 落在區別的同一邊)
      - 斷言量到的是別人夾的(寬度 `lessThanOrEqualTo` 在 cap 拿掉後照樣綠)
      - fallback 恆真、「不包含 X」型斷言對新東西永遠綠
      - `tap` 打不到只警告、`enterText` 不做 hit-test
      - 畫面變高之後既有掃描的 tap 打不到目標而全綠

      這一刀特有的:
      - 「下方 route 還在」的斷言,在 `opaque:true` 之下會不會照樣綠
        (若下方 widget 只是 offstage 仍被 finder 找到,這條守門是假的)
      - 「barrier 點擊會關閉」的斷言,座標是不是真的落在面板外

  fix:
    kind: task
    role: fixer
    after: [test, code-review, uiux-review, guard-audit]
    when: any-fail
    goto: [test, code-review, uiux-review, guard-audit]
    max_iterations: 2
    prompt: |
      三份 review 的判定與發現如下,逐條處理,不要自己重做 review:

      code-review: {{ nodes.code-review.output }}
      uiux-review: {{ nodes.uiux-review.output }}
      guard-audit: {{ nodes.guard-audit.output }}

      標 blocker 的必修;標 nit 的一併修掉,除非你能說出不修的理由。
      每補一條守門就說明能讓它紅的突變,並實際跑一次證明它會紅。

  ship:
    kind: gate
    after: [test, code-review, uiux-review, guard-audit]
    when: all-pass
    show: |
      code review:
      {{ nodes.code-review.output }}

      UI/UX:
      {{ nodes.uiux-review.output }}

      守門稽核:
      {{ nodes.guard-audit.output }}
