name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable

      - run: flutter pub get

      # Surface a standard semver build label in-app (APP_VERSION from
      # pubspec + the CI run number as the build), so a mobile browser hitting
      # the deployed Pages URL can confirm which build it's running (Flutter
      # web's service worker caches hard) — the build number changes each deploy.
      - name: Build web
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APP_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          flutter build web \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_NUMBER="$RUN_NUMBER"

      # Pages deploy must be given the account id explicitly. Unlike Workers
      # deploy, `wrangler pages deploy` resolves the account via the user-level
      # /memberships endpoint, which an account-scoped API token cannot access
      # (Cloudflare error 9106). Passing accountId skips that lookup.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=life-os
