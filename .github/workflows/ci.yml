name: CI

on:
  # Push-only: every commit on a non-main branch runs CI exactly once. A PR
  # does NOT add a second run — its checks are attached to the head commit's
  # push run (GitHub keys status checks by commit SHA), so the PR is still
  # gated. Listening to `pull_request` as well would double every push on a
  # branch that has an open PR (the two events carry different `github.ref`,
  # so `concurrency` can't dedupe them). main is built/deployed by deploy.yml.
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in well under a minute. A cap matters because the failure
    # mode we actually hit — a synchronous notify re-entering its own listener —
    # HANGS rather than fails: it never yields, so `flutter test`'s own
    # (timer-based) per-test timeout never fires. Without this, such a
    # regression burns the GitHub default of 360 minutes before going red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable

      # `test/shared/pwa/push_sw_ack_contract_test.dart` executes the real
      # `web/push_sw.js` under `node`. ubuntu-latest ships one already, but
      # pinning it means the guard's runtime is reproducible rather than
      # whatever the runner image happens to carry. The test FAILS (never
      # skips) if node is missing, so this step is load-bearing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: flutter pub get

      - run: flutter analyze

      # GitHub runners are UTC, so this run is the UTC direction on its own.
      - run: flutter test

      # ...and this is the other one. Guards over "which day is it here"
      # (the health screen's batch reads one day and every card must agree on
      # it) can only go red where the local date differs from the UTC date, so
      # a UTC-only CI would have stayed green through a day-locality
      # regression — e.g. computing today from `clock().toUtc()` instead of
      # local time, measured red only at UTC+8. Asia/Taipei is the developer
      # machine's zone, which is where those guards were written and verified.
      # The suite runs in well under a minute, so running it twice is cheap;
      # note the hang caveat on `timeout-minutes` above applies to both runs.
      - run: TZ=Asia/Taipei flutter test

      - run: flutter build web
