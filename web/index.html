<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your calm daily life tracker — food, water, and more.">

  <!-- Notch-safe viewport. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Branded status-bar / theme color: cream in light, dark ground in dark. -->
  <meta name="theme-color" content="#FBF1E1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#231D19" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>LifeOS</title>
  <link rel="manifest" href="manifest.json?v=2">

  <style>
    /* ---- Chiikawa pastel PWA chrome (splash / install / offline) ---- */
    :root {
      --lifeos-cream: #FBF1E1;
      --lifeos-dark: #231D19;
      --lifeos-surface: #FFFDF8;
      --lifeos-ink: #5A4A3E;
      --lifeos-outline: #D8C3A6;
      --lifeos-primary: #8FD3E6;
      --lifeos-amber: #F4D9A0;
    }

    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background-color: var(--lifeos-cream);
      /* Must stay the family name `pubspec.yaml` registers: Flutter web
         injects its @font-face under that name, so the splash and the app
         share one font once the engine boots. */
      font-family: "NotoSans", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: var(--lifeos-dark); }
    }

    /* Branded splash overlay: shown immediately, removed on first frame. */
    #lifeos-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: var(--lifeos-cream);
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    #lifeos-splash.lifeos-hide { opacity: 0; }
    #lifeos-splash img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 4px 0 rgba(216, 195, 166, 0.55);
    }
    #lifeos-splash .lifeos-wordmark {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--lifeos-ink);
    }
    @media (prefers-color-scheme: dark) {
      #lifeos-splash { background-color: var(--lifeos-dark); }
      #lifeos-splash .lifeos-wordmark { color: #F3E7D6; }
    }

    /* Slim offline indicator across the top. */
    #lifeos-offline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2147483646;
      display: none;
      padding: calc(env(safe-area-inset-top) + 6px) 12px 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--lifeos-ink);
      background-color: var(--lifeos-amber);
      border-bottom: 1px solid var(--lifeos-outline);
    }
    #lifeos-offline.lifeos-show { display: block; }
  </style>
</head>
<body>
  <!-- Branded splash: replaces the blank white flash before Flutter boots. -->
  <div id="lifeos-splash">
    <img src="icons/Icon-192.png?v=2" alt="LifeOS">
    <div class="lifeos-wordmark">LifeOS</div>
  </div>

  <!-- Offline indicator (top). -->
  <div id="lifeos-offline">離線中 — 部分功能無法使用 / You're offline</div>

  <script>
    (function () {
      // ---- Splash: fade out + remove once Flutter renders its first frame.
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('lifeos-splash');
        if (!splash) return;
        splash.classList.add('lifeos-hide');
        splash.addEventListener('transitionend', function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        });
        // Fallback removal in case transitionend doesn't fire.
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 600);
      });

      // ---- Offline indicator.
      var offlineBar = document.getElementById('lifeos-offline');
      function updateOnline() {
        if (navigator.onLine) {
          offlineBar.classList.remove('lifeos-show');
        } else {
          offlineBar.classList.add('lifeos-show');
        }
      }
      window.addEventListener('online', updateOnline);
      window.addEventListener('offline', updateOnline);
      updateOnline();

      // ---- Install bridge (add-to-home). No visible banner here anymore:
      // the install entry point lives in the app's Settings screen, which
      // reads this `window.pwaInstall` bridge and calls prompt() on it.
      var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
      var isStandalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var deferredPrompt = null;

      window.pwaInstall = {
        // A beforeinstallprompt is pending (Chromium Android/desktop).
        available: false,
        // Already running as an installed / standalone PWA.
        standalone: isStandalone,
        // iOS Safari has no beforeinstallprompt — needs the manual hint.
        iosHint: isIOS && !isStandalone,
        // Triggers the stashed prompt; resolves once the user chooses.
        // No-op (resolved) when nothing is pending.
        prompt: function () {
          if (!deferredPrompt) return Promise.resolve();
          var p = deferredPrompt;
          deferredPrompt = null;
          window.pwaInstall.available = false;
          p.prompt();
          return p.userChoice;
        }
      };

      // Chromium: stash the event and mark install available for Flutter.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        window.pwaInstall.available = true;
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        window.pwaInstall.available = false;
        window.pwaInstall.iosHint = false;
      });

      // ---- Update bridge (new-version-available). The Flutter service
      // worker installs a new version in the background but keeps serving the
      // old cached shell until reload. This exposes window.pwaUpdate so the
      // app's Settings-style banner can DETECT a ready update and apply it.
      window.pwaUpdate = {
        // A newer version has installed behind the controlling worker.
        available: false,
        // Reliably load the new version (see applyUpdate below).
        apply: function () { return applyUpdate(); }
      };

      function markUpdateReady() {
        window.pwaUpdate.available = true;
      }

      // The Flutter SW doesn't honor skipWaiting, so the guaranteed path is to
      // unregister it and reload; SKIP_WAITING is best-effort. Only Flutter's
      // own (root-scope) registration is unregistered here — NOT the separate
      // `/push/`-scope push service worker (see push_sw.js), which must
      // survive an app update or its push subscription would be silently
      // destroyed until the user re-enables notifications (design D6b).
      async function applyUpdate() {
        var flutterReg = null;
        try {
          flutterReg = await navigator.serviceWorker.getRegistration();
          if (flutterReg && flutterReg.waiting) {
            flutterReg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        } catch (e) { /* ignore */ }
        try {
          if (flutterReg) await flutterReg.unregister();
        } catch (e) { /* ignore */ }
        location.reload();
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function (registration) {
          // A new worker only counts as an *update* (not first install) when
          // an old one is already controlling the page.
          function onInstalled(worker) {
            if (worker.state === 'installed' &&
                navigator.serviceWorker.controller) {
              markUpdateReady();
            }
          }
          function watch(worker) {
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              onInstalled(worker);
            });
          }

          // A worker may already be waiting from a previous visit.
          if (registration.waiting && navigator.serviceWorker.controller) {
            markUpdateReady();
          }
          watch(registration.installing);
          registration.addEventListener('updatefound', function () {
            watch(registration.installing);
          });

          // Proactively check for a fresh deploy: on load, a while after the
          // tab becomes visible again, and on a periodic timer.
          function checkForUpdate() {
            registration.update().catch(function () { /* ignore */ });
          }
          checkForUpdate();
          // NOT from the visibility transition itself (issue #226). A
          // notification tap brings this window forward with the very
          // `visibilitychange` this listener runs on, and right after a
          // deploy `registration.update()` is a full worker install —
          // download plus cache write — started at the exact instant the
          // user is trying to use the app. The check still happens, just
          // never as part of the app becoming interactive. One pending timer
          // at a time, so repeated foregrounding cannot pile them up.
          var deferredCheck = null;
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible') {
              // Backgrounding can freeze this timer mid-flight rather than
              // cancel it; left armed, it would fire on the next resume —
              // landing the update check on exactly the foreground moment
              // this deferral exists to keep clear of.
              if (deferredCheck !== null) {
                clearTimeout(deferredCheck);
                deferredCheck = null;
              }
              return;
            }
            if (deferredCheck !== null) return;
            deferredCheck = setTimeout(function () {
              deferredCheck = null;
              checkForUpdate();
            }, 10 * 1000);
          });
          setInterval(checkForUpdate, 30 * 60 * 1000);
        }).catch(function () { /* ignore */ });
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
