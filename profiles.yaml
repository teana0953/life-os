# graphflow cost profiles for this repo. Picked up automatically because it
# sits at the project root — the plugin's own file is the fallback, and its
# heavy/standard tiers are Fable, which we do not use here.
#
# Opus is the top tier for this repo's runs: review and audit nodes get it,
# and the fixer gets Sonnet (Haiku wrote a commit message claiming a test it
# had not written, twice-caught in run pr-review-msn4qmip).
profiles:
  max:      { heavy: { model: opus }, standard: { model: opus },                light: { model: sonnet } }
  balanced: { heavy: { model: opus }, standard: { model: opus },                light: { model: sonnet } }
  budget:   { heavy: { model: opus }, standard: { model: sonnet },              light: { model: haiku } }
